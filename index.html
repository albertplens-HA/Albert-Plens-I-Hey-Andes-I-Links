<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cristóbal Allel</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg,#0F172A,#1E293B);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:20px;
        }

        .card{
            background:#ffffff;
            width:100%;
            max-width:420px;
            padding:40px 30px;
            border-radius:20px;
            text-align:center;
            box-shadow:0 15px 40px rgba(0,0,0,.25);
        }

        .avatar{
            width:90px;
            height:90px;
            border-radius:50%;
            background:#2563EB;
            color:white;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:34px;
            font-weight:bold;
            margin:0 auto 20px;
        }

        h1{
            color:#111827;
            margin-bottom:10px;
        }

        p{
            color:#6B7280;
            margin-bottom:30px;
        }

        .btn{
            display:block;
            text-decoration:none;
            color:white;
            padding:15px;
            border-radius:12px;
            margin:12px 0;
            font-weight:bold;
            transition:.2s;
        }

        .btn:hover{
            transform:translateY(-2px);
        }

        .linkedin{
            background:#0077B5;
        }

        .diagnostico{
            background:#F97316;
        }

        .calculadora{
            background:#10B981;
        }

        .footer{
            margin-top:25px;
            font-size:12px;
            color:#9CA3AF;
        }
    </style>
</head>
<body>

    <div class="card">

        <div class="avatar">CA</div>

        <h1>Cristóbal Allel</h1>

        <p>Recursos y herramientas para optimizar la gestión hotelera.</p>

        <a
            class="btn linkedin"
            href="https://www.linkedin.com/in/cristobal-allel/"
            target="_blank">
            LinkedIn
        </a>

        <a
            class="btn diagnostico"
            href="https://app.heyandes.com/lm/diagnostico"
            target="_blank">
            Diagnóstico OTA Gratuito
        </a>

        <a
            class="btn calculadora"
            href="https://app.heyandes.com/lm/calculadora-ota"
            target="_blank">
            Calculadora OTA
        </a>

        <div class="footer">
            © Cristóbal Allel
        </div>

    </div>

</body>
</html>
