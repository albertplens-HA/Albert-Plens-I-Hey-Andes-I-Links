<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Albert Plens</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family: Arial, Helvetica, sans-serif;
    }

    body{
        background: linear-gradient(135deg,#0f172a,#1e293b);
        min-height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        padding:20px;
    }

    .container{
        background:white;
        width:100%;
        max-width:420px;
        padding:40px 30px;
        border-radius:20px;
        box-shadow:0 15px 40px rgba(0,0,0,.2);
        text-align:center;
    }

    .avatar{
        width:120px;
        height:120px;
        border-radius:50%;
        background:#e5e7eb;
        margin:0 auto 20px;
        display:flex;
        align-items:center;
        justify-content:center;
        font-size:42px;
        font-weight:bold;
        color:#334155;
    }

    h1{
        color:#0f172a;
        margin-bottom:10px;
    }

    p{
        color:#64748b;
        margin-bottom:30px;
    }

    .btn{
        display:block;
        width:100%;
        padding:15px;
        margin:12px 0;
        border-radius:12px;
        text-decoration:none;
        color:white;
        font-weight:bold;
        transition:.3s;
    }

    .btn:hover{
        transform:translateY(-2px);
    }

    .linkedin{
        background:#0077B5;
    }

    .ota{
        background:#16a34a;
    }

    .diagnostico{
        background:#f97316;
    }

    footer{
        margin-top:25px;
        font-size:12px;
        color:#94a3b8;
    }
</style>
</head>

<body>

<div class="container">

    <div class="avatar">AP</div>

    <h1>Albert Plens</h1>

    <p>Consultor de Revenue Management y Distribución Hotelera</p>

    <a class="btn linkedin"
       href="https://www.linkedin.com/in/albert-plens-i-gorgues-15159a173/"
       target="_blank">
       LinkedIn
    </a>

    <a class="btn ota"
       href="https://app.heyandes.com/lm/calculadora-ota"
       target="_blank">
       Calculadora OTA
    </a>

    <a class="btn diagnostico"
       href="https://app.heyandes.com/lm/diagnostico"
       target="_blank">
       Diagnóstico Gratuito
    </a>

    <footer>
        © Albert Plens
    </footer>

</div>

</body>
</html>
